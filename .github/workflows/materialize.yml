name: Materialize Yardify source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Extract source bundle
        run: |
          tar -xzf yardify-src.tgz
          rm -f yardify-src.tgz
      - name: Commit extracted app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Materialize Yardify application source'
          git push
